<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5eee2"><link rel="manifest" href="manifest.webmanifest">
<title>Дворцовая жизнь</title><link rel="stylesheet" href="styles.css">
</head><body><main class="app">
<header><div class="eyebrow">ДВОРЦОВАЯ ХРОНИКА</div><h1>Жизнь во дворце</h1><p class="sub">Твоя история начинается с выбранной даты.</p></header>
<section id="setup" class="panel">
<h2>Выбери дату начала</h2><p>Прокручивай колёсики, как на iPhone.</p>
<div class="wheels"><label>День<select id="day"></select></label><label>Месяц<select id="month"></select></label><label>Год<select id="year"></select></label></div>
<button id="start">Начать историю</button>
</section>
<section id="game" class="panel hidden">
<div class="topline"><span id="dateLabel"></span><span id="progress">Выбор 1 из 3</span></div>
<h2 id="eventTitle"></h2><p id="story" class="story"></p><div id="choices" class="choices"></div>
</section>
<section id="recap" class="panel hidden"><div class="eyebrow">КОНЕЦ ДНЯ</div><h2>Итоги дня</h2><div id="recapText" class="story"></div><button id="nextDay">Начать следующий день</button></section>
<section class="panel diary"><h2>Дневник</h2><div id="diaryList" class="muted">Здесь появятся записи после первого дня.</div></section>
<footer>Историческая атмосфера, вымышленная история.</footer></main><script src="app.js"></script></body></html>
